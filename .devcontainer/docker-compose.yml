version: '3.9'

services:
  app:
    image: node:20-bookworm
    volumes:
      - ..:/workspaces/devtinder:cached
      - node_home:/home/node
    command: sleep infinity
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mongo_data:
  node_home:
